project:
  name: voice-screening
  random_seed: 42

analysis:
  # confirmatory: no test-set tuning/selection.
  # exploratory: notebook-style exploratory selection on test.
  mode: confirmatory

  # Optional explicit override. Leave unset for mode defaults:
  #   confirmatory -> val
  #   exploratory  -> test
  selection_split:

  final:
    # Refit locked-final models on train+val before the one-shot held-out test.
    refit_on_train_val: true
    # Evaluate all configured models at locked K/aggregation in final test stage.
    evaluate_all_models_at_locked_k: true

reproducibility:
  # Set true to request deterministic PyTorch behavior where supported.
  torch_deterministic: false

paths:
  data_root: raw_data
  outputs_root: outputs

files:
  phenotype_tsv: phenotype.tsv
  static_features_tsv: static_features.tsv

columns:
  participant_id: participant_id
  session_id: session_id
  task_name: task_name
  transcription: transcription

feature_selection:
  exclude_columns:
    - participant_id
    - session_id
    - task_name
    - transcription
    - label
    - pd_label
    - control_label

modeling:
  # Notebook-style participant split:
  # first 20% test, then 20% of remaining participants for validation.
  split:
    test_fraction: 0.2
    validation_fraction: 0.2

  threshold: 0.5
  metrics:
    - roc_auc
    - accuracy
    - f1
    - precision
    - recall

  models:
    - logistic_regression
    - elastic_net_logistic
    - random_forest
    - extra_trees
    - hist_gradient_boosting
    - svc_rbf
    - mlp
    - residual_mlp
    - wide_deep_mlp

  # Patient-level aggregation exploration for final patient-level training.
  patient_aggregation_methods:
    - mean
    - median
    - max
    - min
    - std
  # Metric used to select patient-level aggregation in confirmatory mode.
  patient_selection_metric: roc_auc

hyperparameters:
  logistic_regression:
    C: 1.0
    penalty: l2
    solver: lbfgs
    max_iter: 1000
    class_weight: balanced
  elastic_net_logistic:
    loss: log_loss
    penalty: elasticnet
    alpha: 0.0003
    l1_ratio: 0.2
    max_iter: 2500
    tol: 0.0001
    class_weight: balanced
  random_forest:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 20
    min_samples_leaf: 10
    max_features: sqrt
    class_weight: balanced
    n_jobs: -1
  extra_trees:
    n_estimators: 500
    max_depth: 12
    min_samples_split: 10
    min_samples_leaf: 5
    max_features: sqrt
    class_weight: balanced
    n_jobs: -1
  hist_gradient_boosting:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.01
    early_stopping: true
    validation_fraction: 0.2
    n_iter_no_change: 15
  svc_rbf:
    C: 2.0
    kernel: rbf
    gamma: scale
    probability: true
    class_weight: balanced
  mlp:
    backend: pytorch
    hidden_dims: [256, 128, 64]
    dropout_rate: 0.3
    lr: 0.0006
    weight_decay: 0.008
    batch_size: 128
    epochs: 40
    patience: 6
    min_delta: 0.0001
    noise_std: 0.01
    label_smoothing: 0.1
    gradient_clip: 0.5
    pct_start: 0.2
    device: auto
    validation_fraction: 0.2
  residual_mlp:
    hidden_dims: [256, 128, 64]
    dropout_rate: 0.25
    lr: 0.0005
    weight_decay: 0.01
    batch_size: 128
    epochs: 50
    patience: 8
    min_delta: 0.0001
    noise_std: 0.01
    label_smoothing: 0.05
    gradient_clip: 1.0
    pct_start: 0.2
    device: auto
    validation_fraction: 0.2
    use_batch_norm: true
  wide_deep_mlp:
    hidden_dims: [192, 96, 48]
    dropout_rate: 0.2
    lr: 0.0007
    weight_decay: 0.005
    batch_size: 128
    epochs: 45
    patience: 7
    min_delta: 0.0001
    noise_std: 0.008
    label_smoothing: 0.05
    gradient_clip: 0.8
    pct_start: 0.2
    device: auto
    validation_fraction: 0.2
    use_batch_norm: true

cluster:
  linkage: ward

  # Coarse K exploration (notebook-style broad sweep).
  exploration_k_values: [5, 10, 15, 20, 50, 70, 90, 110, 130]

  # Models used for coarse/fine K search. Final locked evaluation can still
  # run all models from modeling.models.
  search_models: [mlp, residual_mlp, wide_deep_mlp]

  # Feature-level aggregation methods used in coarse exploration.
  aggregation_methods: [mean, pca, max, min, std, median, sum]

  # Default cluster aggregation for scripts that need a single method.
  aggregation: mean

  fine_tune:
    enabled: true

    # Notebook-style fine-tune around a contender K, run on one model and one
    # cluster aggregation method.
    model: mlp
    cluster_aggregation: mean
    metric: roc_auc

    # Selector model for choosing K from coarse/fine search.
    # policy:
    #   fixed -> use fine_tune.model
    #   best_available -> choose highest coarse metric model
    #   best_available_prefer_dl -> choose highest coarse metric among dl_models first
    selection_model:
      policy: best_available_prefer_dl
      fixed: mlp
      dl_models: [mlp, residual_mlp, wide_deep_mlp]
      preferred_order:
        - mlp
        - residual_mlp
        - wide_deep_mlp
        - random_forest
        - extra_trees
        - logistic_regression
        - elastic_net_logistic
        - hist_gradient_boosting
        - svc_rbf

    # Optional manual center K (left unset by default).
    center_k:

    selection:
      strategy: small_k_near_top
      preferred_k_min: 8
      preferred_k_max: 40
      near_top_delta: 0.03
      prefer_smallest_k: false
      # Optional manual lock override for final K selection. Leave empty to use
      # configured lock_strategy.
      # You can also set VOICE_SCREENING_OVERRIDE_K at runtime.
      override_k:
      # Final fine-tune K locking logic:
      # performance_only -> highest selection metric in fine-tune table.
      # stability_only -> highest bootstrap ARI in fine-tune K region
      # (ties: higher selection metric, then smaller K).
      # balanced_stability_performance -> stability gate + ROC/F1/accuracy
      # gate, then weighted score with small-K preference.
      # performance_plus_validity -> choose among near-top fine Ks using
      # performance + cluster validity diagnostics + slight small-K preference.
      lock_strategy: balanced_stability_performance
      balanced:
        stability_metric: stability_ari_mean
        stability_near_top_delta: 0.03
        roc_auc_near_top_delta: 0.015
        f1_near_top_delta: 0.02
        accuracy_near_top_delta: 0.02
        min_performance_votes: 2
        prefer_smallest_k: true
        weights:
          roc_auc: 0.53
          stability: 0.30
          f1: 0.10
          accuracy: 0.05
          small_k: 0.02
      validity:
        near_top_delta: 0.01
        weights:
          performance: 0.60
          stability: 0.20
          elbow: 0.10
          silhouette: 0.05
          small_k: 0.05
        stability:
          n_bootstrap: 8
          sample_fraction: 0.8

    window: 2
    min_k: 5
    max_k: 130
    include_k: []

reporting:
  permutation_importance_iterations: 20

  cluster_validation:
    # Number of train-resample fits used for assignment stability at each K.
    n_bootstrap: 8
    # Fraction of training recordings sampled per bootstrap replicate.
    sample_fraction: 0.8

  progressive_selection:
    removal_percentage: 0.10
    min_features: 10
    use_clustering: true
    cluster_ratio: 0.8
    importance_iterations: 5
